<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Cat</title>
    <link id="dynamic-favicon" rel="icon" href="./favicon.ico?v=20260516-rounded" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#666a73" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="scene-shell">
      <canvas id="glow-scene" aria-label="Interactive glowing sphere"></canvas>

      <section class="controls" aria-label="Glow colour controls" hidden>
        <div class="forecast-readout">
          <span id="expected-value" class="temperature-value">--</span>
          <output id="hex-value" class="hex-value">#800080</output>
        </div>

        <dl class="weather-strip">
          <div>
            <dt>Time</dt>
            <dd id="forecast-time-value">--</dd>
          </div>
          <div>
            <dt>Rain</dt>
            <dd id="rain-value">--</dd>
          </div>
          <div>
            <dt>Next</dt>
            <dd id="next-update-value">--</dd>
          </div>
        </dl>

        <p class="scale-value">
          Scale <span id="scale-min-value">--</span>-<span id="scale-max-value">--</span>
        </p>
        <p id="location-value" class="location-value">Locating...</p>
        <div class="panel-links">
          <button id="show-colour-map-control" class="page-link link-button" type="button">Colour</button>
          <button id="hide-panel-control" class="page-link link-button" type="button">Hide</button>
        </div>
      </section>

      <button id="show-panel-control" class="page-link link-button unhide-control" type="button" hidden>
        Show info
      </button>

      <section class="colour-overlay" id="colour-map-overlay" aria-labelledby="colour-title" hidden>
        <div class="colour-panel">
          <div class="header-row">
            <h1 id="colour-title">Colour map</h1>
          </div>

          <div class="colour-map-wrap">
            <div class="colour-y-axis-label" aria-hidden="true">Chance of rain</div>
            <div class="colour-y-axis" aria-hidden="true">
              <span>100%</span>
              <span>50%</span>
              <span>0%</span>
            </div>
            <div class="colour-chart">
              <canvas
                class="colour-map"
                id="colour-map"
                width="401"
                height="401"
                role="img"
                aria-label="Calculated colour map"
              ></canvas>
              <div class="colour-x-axis" aria-hidden="true">
                <span id="colour-scale-min">--</span>
                <span id="colour-scale-mid">--</span>
                <span id="colour-scale-max">--</span>
              </div>
              <div class="colour-x-axis-label" aria-hidden="true">Apparent temperature</div>
            </div>
          </div>
        </div>
        <button id="hide-colour-map-control" class="page-link link-button corner-link" type="button">Home</button>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
