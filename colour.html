<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Cat Colour</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#62c9ed" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="colour-page">
    <main class="colour-shell">
      <section class="colour-panel" aria-labelledby="colour-title">
        <div class="header-row">
          <h1 id="colour-title">Colour map</h1>
        </div>

        <div class="colour-map-wrap">
          <div class="colour-y-axis-label" aria-hidden="true">Chance of rain</div>
          <div class="colour-y-axis" aria-hidden="true">
            <span>100%</span>
            <span>50%</span>
            <span>0%</span>
          </div>
          <div class="colour-chart">
            <canvas
              class="colour-map"
              id="colour-map"
              width="401"
              height="401"
              role="img"
              aria-label="Calculated colour map"
            ></canvas>
            <div class="colour-x-axis" aria-hidden="true">
              <span id="colour-scale-min">--</span>
              <span id="colour-scale-mid">--</span>
              <span id="colour-scale-max">--</span>
            </div>
            <div class="colour-x-axis-label" aria-hidden="true">Apparent temperature</div>
          </div>
        </div>
      </section>
      <a class="page-link corner-link" href="./index.html">Home</a>
    </main>
    <script type="module" src="./src/colour.js"></script>
  </body>
</html>
